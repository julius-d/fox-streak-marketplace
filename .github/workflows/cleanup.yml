name: Cleanup PR data

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.label.name == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Run cleanup script
        run: python scripts/cleanup_pr_data.py --base "origin/${{ github.event.pull_request.base.ref }}"

      - name: Validate cleaned files
        run: |
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false -s schema/marketplace.schema.json -d "marketplace.json"
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false -s schema/pack.schema.json -d "packs/**/pack.json"
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false -s schema/question-set.schema.json -d "packs/**/sets/*.foxstreak.json"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate UUIDs, dedupe choices, sync pack/marketplace listings"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Remove cleanup label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: "cleanup",
            }).catch(() => {});
